name: CI

# Compila y prueba en cada cambio. Usa el wrapper del repositorio para que la version de Maven sea
# la misma aqui y en el equipo de quien desarrolla.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Cachea ~/.m2 entre ejecuciones: sin esto cada build vuelve a descargar las dependencias.
          cache: maven

      - name: Compilar y probar
        run: ./mvnw -B --no-transfer-progress verify
